<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Premise prototype</title>
<style>
:root{--bg:#f2f4f8;--fg:#101828;--mut:#5b6678;--card:#fff;--line:#d9dee8;--acc:#2f3bd4;--src:#b45309;--cnt:#be123c;--q:#0369a1;--ok:#15803d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e131c;--fg:#e8ecf4;--mut:#93a0b5;--card:#171e2b;--line:#2b3547;--acc:#8b94ff;--src:#f59e0b;--cnt:#fb7185;--q:#38bdf8;--ok:#4ade80}}
:root[data-theme="dark"]{--bg:#0e131c;--fg:#e8ecf4;--mut:#93a0b5;--card:#171e2b;--line:#2b3547;--acc:#8b94ff;--src:#f59e0b;--cnt:#fb7185;--q:#38bdf8;--ok:#4ade80}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px}
header b{font:700 22px Georgia,serif;letter-spacing:-.02em}
nav{display:flex;gap:6px}
button,input,textarea,select{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn.on,.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer}
.card h3{margin:4px 0;font:600 18px/1.3 Georgia,serif}
.meta{color:var(--mut);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.type{font-size:13px;font-weight:600;color:var(--acc)}
h1{font:700 28px/1.2 Georgia,serif;margin:8px 0}
.art p{font:18px/1.7 Georgia,"Iowan Old Style",serif;margin:0 0 16px}
mark.h{background:color-mix(in srgb,var(--c) 16%,transparent);border-bottom:2px solid var(--c);color:inherit;cursor:pointer}
.rev{margin:10px 0;font-size:14px}.rev summary{cursor:pointer;color:var(--ok)}
.rev div{padding:4px 0;color:var(--mut)}
.hint{font-size:14px;color:var(--mut);border-left:3px solid var(--line);padding-left:10px;margin:12px 0}
.th{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px;margin-bottom:10px;scroll-margin-top:12px}
.th q{display:block;font:italic 15px/1.4 Georgia,serif;color:var(--mut);margin-bottom:6px;cursor:pointer;quotes:none}
.tag{font-size:13px;font-weight:700;color:var(--c)}
.th a{color:var(--acc)}
.rp{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:15px}
.row{display:flex;gap:6px;margin-top:8px}.row input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px}
.fixed{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);display:flex;gap:6px;justify-content:center;flex-wrap:wrap;align-items:center;z-index:5}
.fixed span{font-size:14px;color:var(--mut)}
#sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}
#sheet.open{display:flex}
#sheet>div{background:var(--card);width:100%;max-width:680px;margin:0 auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
textarea,select,.f{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;margin:6px 0}
textarea{min-height:90px;resize:vertical}
label{font-size:14px;color:var(--mut)}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;margin:10px 0}
</style></head><body><div class="wrap">
<header><b>Premise</b><nav><button class="btn" id="nf">Feed</button><button class="btn" id="nw">Write</button></nav></header>
<main id="app"></main></div>
<div class="fixed" id="bar" hidden></div>
<div id="sheet"><div id="sh"></div></div>
<script>
const T={src:["Needs source","var(--src)"],cnt:["Counterargument","var(--cnt)"],q:["Question","var(--q)"]};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
function mk(by,p,q,tag,txt,rp){return{id:Math.random().toString(36).slice(2),by,p,q,tag,txt,src:"",rp:rp||[],fix:0}}
const P1=["Most investors count positions to measure diversification. Twenty stocks across ten sectors feels safe. But risk comes from factors, not tickers, and many of those twenty names load on the same few: interest-rate sensitivity, liquidity, and growth versus value.","In 2022 the assumption that bonds hedge equities broke down, because both fell as rates rose. A portfolio that looked balanced by asset class behaved like one single bet on falling discount rates.","A better test is to count the independent risk factors a portfolio actually holds. By that measure, many portfolios with dozens of holdings carry fewer than three effective bets."];
const S={posts:[
{id:1,type:"Idea",title:"Your diversification is probably an illusion",by:"Ananya Rao",topic:"Risk",v:1,revs:[],paras:P1,ann:[
mk("Dev Malhotra",2,"fewer than three effective bets","src","Which method produces this number: PCA on returns or a factor model? The answer changes a lot.",[{by:"Ananya Rao",txt:"PCA on five years of weekly returns. I will add the data."}]),
mk("Sara Li",1,"both fell as rates rose","cnt","Equities and bonds fell together, but the hedge failure was largely an inflation shock story, not only rates.")]},
{id:2,type:"Question",title:"Is the Indian 10-year yield mispriced against inflation expectations?",by:"Dev Malhotra",topic:"Macro",v:1,revs:[],paras:["The real yield on the 10-year looks high versus the last decade. Is this a term premium story, or are markets expecting inflation to undershoot the target? I would like competing explanations with data."],ann:[]},
{id:3,type:"Article",title:"A simple test for earnings quality",by:"Sara Li",topic:"Valuation",v:1,revs:[],paras:["Cash flow from operations should track net income over a full cycle. When accruals keep growing faster than revenue, reported profit is being pulled forward.","Compare the accrual ratio across five years, not one. A single bad year is noise; a persistent drift is the signal."],ann:[]}],
view:"feed",cur:null,author:false,topic:"All",sel:null};
const post=()=>S.posts.find(p=>p.id===S.cur);
function para(p,i){const as=p.ann.filter(a=>a.p===i&&!a.fix).sort((a,b)=>a.s-b.s);let t=p.paras[i],o="",c=0;
as.forEach(a=>{o+=esc(t.slice(c,a.s))+`<mark class="h" style="--c:${T[a.tag][1]}" data-a="${a.id}">${esc(t.slice(a.s,a.e))}</mark>`;c=a.e});
return`<p class="para" data-p="${i}">${o+esc(t.slice(c))}</p>`}
function init(){S.posts.forEach(p=>p.ann.forEach(a=>{if(a.s==null){a.s=p.paras[a.p].indexOf(a.q);a.e=a.s+a.q.length}}))}
function render(){const a=$("#app");$("#bar").hidden=true;
$("#nf").className="btn"+(S.view=="feed"?" on":"");$("#nw").className="btn"+(S.view=="write"?" on":"");
if(S.view=="feed"){const ts=["All",...new Set(S.posts.map(p=>p.topic))];
a.innerHTML=`<div class="chips">${ts.map(t=>`<button class="btn${t==S.topic?" on":""}" data-t="${t}">${t}</button>`).join("")}</div>`+
S.posts.filter(p=>S.topic=="All"||p.topic==S.topic).map(p=>{const o=p.ann.filter(x=>!x.fix).length;
return`<div class="card" tabindex="0" role="button" data-o="${p.id}"><span class="type">${p.type}</span><h3>${esc(p.title)}</h3><div class="meta"><span>${esc(p.by)}</span><span>${esc(p.topic)}</span><span>${o} open challenge${o==1?"":"s"}</span>${p.v>1?`<span>Revised v${p.v}</span>`:""}</div></div>`}).join("")}
else if(S.view=="write"){a.innerHTML=`<h1>Write</h1><label>Type</label><select id="wt"><option>Idea</option><option>Article</option><option>Question</option></select><label>Title</label><input class="f" id="wti"><label>Topic</label><input class="f" id="wto" placeholder="e.g. Risk"><label>Body (blank line between paragraphs)</label><textarea id="wb" style="min-height:180px"></textarea><button class="btn pri" id="pub">Publish</button>`}
else{const p=post();a.innerHTML=`<button class="btn" data-back>Back to feed</button><div style="margin-top:12px"><span class="type">${p.type}</span></div><h1>${esc(p.title)}</h1><div class="meta"><span>${esc(p.by)}</span><span>${esc(p.topic)}</span><span>Version ${p.v}</span></div>
${p.revs.length?`<details class="rev"><summary>Revised ${p.revs.length} time${p.revs.length>1?"s":""}</summary>${p.revs.map(r=>`<div><b>v${r.v}</b> ${esc(r.note)}</div>`).join("")}</details>`:""}
<label class="sw"><input type="checkbox" id="au" ${S.author?"checked":""}> View as the author</label>
<div class="hint">Select any words in the text to question or challenge that exact claim.</div>
<div class="art" id="art">${p.paras.map((_,i)=>para(p,i)).join("")}</div>
<h2 style="font:600 20px Georgia,serif">Discussion on specific claims</h2>${p.ann.length?p.ann.map(th).join(""):'<div class="hint">No challenges yet. Select a claim above to start one.</div>'}`}}
function th(a){const[n,c]=T[a.tag];return`<div class="th" id="t${a.id}" style="--c:${c}"><span class="tag">${n}</span> <span class="meta" style="display:inline">${esc(a.by)}${a.fix?" Addressed in v"+a.fix:""}</span><q data-j="${a.id}">${esc(a.q)}</q><div>${esc(a.txt)}</div>${a.src?`<div><a href="${esc(a.src)}" target="_blank" rel="noopener noreferrer">Source</a></div>`:""}
${a.rp.map(r=>`<div class="rp"><b>${esc(r.by)}</b> ${esc(r.txt)}</div>`).join("")}
<div class="row"><input placeholder="Reply with evidence" data-r="${a.id}"><button class="btn" data-s="${a.id}">Reply</button>${S.author&&!a.fix?`<button class="btn pri" data-f="${a.id}">Revise</button>`:""}</div></div>`}
function sheet(h){$("#sh").innerHTML=h;$("#sheet").classList.add("open")}
const close=()=>$("#sheet").classList.remove("open");
document.addEventListener("selectionchange",()=>{if(S.view!="post")return;const s=getSelection(),b=$("#bar");
if(!s.rangeCount||s.isCollapsed){b.hidden=true;return}const r=s.getRangeAt(0),pa=r.startContainer.parentElement?.closest(".para"),pb=r.endContainer.parentElement?.closest(".para");
if(!pa||pa!==pb){b.hidden=true;return}const pr=document.createRange();pr.selectNodeContents(pa);pr.setEnd(r.startContainer,r.startOffset);
const st=pr.toString().length,q=r.toString(),e=st+q.length,i=+pa.dataset.p;
if(post().ann.some(a=>!a.fix&&a.p===i&&st<a.e&&e>a.s)){b.hidden=true;return}
S.sel={p:i,s:st,e,q};b.hidden=false;b.innerHTML=`<span>Challenge this claim:</span>`+Object.entries(T).map(([k,v])=>`<button class="btn" data-k="${k}" style="border-color:${v[1]};color:${v[1]}">${v[0]}</button>`).join("")});
$("#bar").addEventListener("mousedown",e=>e.preventDefault());
document.addEventListener("change",e=>{if(e.target.id=="au"){S.author=e.target.checked;render()}});
document.addEventListener("click",e=>{const t=e.target,d=t.closest("[data-o],[data-t],[data-back],[data-k],[data-j],[data-s],[data-f],[data-h],[data-a],#nf,#nw,#pub,#cl,#ok,#sv");if(!d)return;const D=d.dataset,p=S.view=="post"?post():null;
if(d.id=="nf"||D.back!==undefined){S.view="feed";render()}
else if(d.id=="nw"){S.view="write";render()}
else if(D.t){S.topic=D.t;render()}
else if(D.o){S.cur=+D.o;S.view="post";render();scrollTo(0,0)}
else if(D.a){document.getElementById("t"+D.a)?.scrollIntoView({behavior:"smooth"})}
else if(D.j){const m=document.querySelector(`mark[data-a="${D.j}"]`);m?.scrollIntoView({behavior:"smooth",block:"center"})}
else if(D.k){const k=D.k,sel=S.sel;sheet(`<b style="color:${T[k][1]}">${T[k][0]}</b><q style="display:block;font:italic 15px Georgia,serif;color:var(--mut);margin:6px 0;quotes:none">${esc(sel.q)}</q><textarea id="tx" placeholder="Explain what is missing or wrong"></textarea><input class="f" id="sr" placeholder="Link to a source (optional)"><div class="row"><button class="btn pri" id="ok" data-kk="${k}">Post challenge</button><button class="btn" id="cl">Cancel</button></div>`)}
else if(d.id=="ok"){const txt=$("#tx").value.trim();if(!txt){$("#tx").focus();return}const s=S.sel,a=mk("You",s.p,s.q,d.dataset.kk,txt);a.s=s.s;a.e=s.e;a.src=/^https?:\/\//.test($("#sr").value.trim())?$("#sr").value.trim():"";post().ann.push(a);getSelection().removeAllRanges();close();render()}
else if(d.id=="cl")close();
else if(D.s){const i=document.querySelector(`[data-r="${D.s}"]`),v=i.value.trim();if(v){post().ann.find(x=>x.id==D.s).rp.push({by:S.author?post().by:"You",txt:v});render()}}
else if(D.f){const a=post().ann.find(x=>x.id==D.f);sheet(`<b>Revise this paragraph</b><div class="hint">${esc(a.q)}</div><textarea id="np" style="min-height:140px">${esc(post().paras[a.p])}</textarea><input class="f" id="nn" placeholder="Why are you changing it? Shown to readers"><div class="row"><button class="btn pri" id="sv" data-id="${a.id}">Publish revision</button><button class="btn" id="cl">Cancel</button></div>`)}
else if(d.id=="sv"){const p=post(),a=p.ann.find(x=>x.id==d.dataset.id),n=$("#nn").value.trim(),t=$("#np").value.trim();if(!n||!t){$("#nn").focus();return}
p.v++;p.paras[a.p]=t;p.revs.push({v:p.v,note:n});p.ann.filter(x=>x.p===a.p).forEach(x=>x.fix=p.v);close();render()}
else if(d.id=="pub"){const ti=$("#wti").value.trim(),b=$("#wb").value.trim();if(!ti||!b){$("#wti").focus();return}
const n={id:Date.now(),type:$("#wt").value,title:ti,by:"You",topic:$("#wto").value.trim()||"General",v:1,revs:[],paras:b.split(/\n\s*\n/),ann:[]};S.posts.unshift(n);S.cur=n.id;S.view="post";S.author=true;render()}});
$("#sheet").addEventListener("click",e=>{if(e.target.id=="sheet")close()});
init();render();
</script></body></html>
